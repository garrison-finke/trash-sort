<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash Sort</title>
    <link rel="stylesheet" href = "/src/style.css">
</head>
<body>
    <script type = "module" src = "/src/main.js"></script>

    <div id="levelButtons">
        <button type="button" data-level="regular">Regular</button>
        <button type="button" data-level="oss">OSS</button>
        <button type="button" data-level="asc">ASC</button>
        <button type="button" data-level="scc">SCC</button>        
    </div>
    

    <button type = "button" id="downloadHighScores">Download High Scores</button>
    <input type = "file" id="loadHighScores" accept=".txt"/>
</body>
</html>
